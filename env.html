<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Окружение: северная тайга</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: #dfe6ee; }
      canvas#view { display: block; width: 100vw; height: 100vh; }
      /* мягкая виньетка поверх кадра (необязательна для игры) */
      #vignette { position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(4,8,14,0.38) 100%); }
      #hud { position: fixed; left: 10px; top: 8px; padding: 6px 10px; background: rgba(8,12,18,.55); border-radius: 6px;
        white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0d10; color: #aab6c3; font-size: 15px; z-index: 5; }
      body.nohud #hud, body.nohud #vignette { display: none; }
      body.novig #vignette { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="vignette"></div>
    <div id="hud"></div>
    <div id="loading">Загрузка тайги…</div>
    <script type="module" src="/src/env-demo.ts"></script>
  </body>
</html>
